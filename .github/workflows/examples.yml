# =============================================================================
# examples.yml
#
# Weekly code example rendering pipeline. Same as daily pipeline but also
# renders code examples. Produces examples.parquet and PNG files.
#
# Schedule: Sundays at 04:00 UTC
# Manual trigger: workflow_dispatch
#
# Part of Milestone 10: Docker & Cloud Run Deployment
# =============================================================================

name: Weekly Examples

on:
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:

env:
  GCP_REGION: europe-north1
  GCP_SERVICE_NAME: ggplot2-companion

jobs:
  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    env:
      HAS_GCP: ${{ secrets.GCP_PROJECT_ID != '' }}

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.3'
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev libssl-dev libxml2-dev cmake \
            libfontconfig1-dev libfreetype6-dev libpng-dev \
            libtiff-dev libjpeg-dev libwebp-dev libicu-dev \
            libharfbuzz-dev libfribidi-dev libglpk-dev

      # Same renv cache as pipeline.yml — shared between workflows
      - name: Cache renv packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/R/renv
          key: renv-pipeline-${{ runner.os }}-${{ hashFiles('renv.lock') }}
          restore-keys: |
            renv-pipeline-${{ runner.os }}-

      - name: Restore R packages
        run: |
          Rscript -e '
            if (!requireNamespace("renv", quietly = TRUE)) install.packages("renv")
            renv::restore(prompt = FALSE)
            for (pkg in c("targets", "pkgload")) {
              if (!requireNamespace(pkg, quietly = TRUE)) install.packages(pkg)
            }
          '

      - name: Run targets pipeline with examples
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
          RENDER_EXAMPLES: 'true'
        run: Rscript -e 'targets::tar_make()'

      # Save examples data and GitHub DESCRIPTION enrichment so the daily
      # pipeline can restore them. Without github_descriptions.rds, daily
      # runs would lose title/license/version for non-CRAN packages.
      # Uses the same cache key as pipeline.yml's "Cache examples data" step.
      - name: Cache examples and enrichment data
        uses: actions/cache/save@v4
        with:
          path: |
            data/examples.parquet
            data/github_descriptions.rds
            inst/app/www/examples/
          key: examples-data-${{ hashFiles('data-raw/packages_curated.csv') }}

      - name: Authenticate to Google Cloud
        if: env.HAS_GCP == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        if: env.HAS_GCP == 'true'
        env:
          REGION: ${{ env.GCP_REGION }}
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev"

      - name: Set up Docker Buildx
        if: env.HAS_GCP == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        if: env.HAS_GCP == 'true'
        uses: docker/build-push-action@v5
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: ${{ env.GCP_REGION }}
          SERVICE: ${{ env.GCP_SERVICE_NAME }}
        with:
          context: .
          push: true
          tags: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.SERVICE }}/${{ env.SERVICE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Cloud Run
        if: env.HAS_GCP == 'true'
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: ${{ env.GCP_REGION }}
          SERVICE: ${{ env.GCP_SERVICE_NAME }}
          SHA: ${{ github.sha }}
        run: |
          IMAGE_TAG="${REGION}-docker.pkg.dev/${PROJECT_ID}/${SERVICE}/${SERVICE}:${SHA}"
          gcloud run deploy "${SERVICE}" \
            --image "${IMAGE_TAG}" \
            --region "${REGION}" \
            --platform managed \
            --allow-unauthenticated \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 3 \
            --port 3838
