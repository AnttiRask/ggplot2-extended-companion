# =============================================================================
# check.yml
#
# PR checks workflow: runs R CMD check (which includes testthat tests)
# and CSV validation on pull requests.
#
# Part of Milestone 10: Docker & Cloud Run Deployment
# =============================================================================

name: PR Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # Override renv's project library to a plain directory that
      # R CMD check can access (renv's default symlink layout doesn't
      # work with R CMD check's --vanilla subprocess)
      RENV_PATHS_LIBRARY: /home/runner/R/lib
      R_LIBS_USER: /home/runner/R/lib

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.3'
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev libssl-dev libxml2-dev cmake \
            libfontconfig1-dev libfreetype6-dev libpng-dev \
            libtiff-dev libjpeg-dev libwebp-dev libicu-dev \
            libharfbuzz-dev libfribidi-dev libglpk-dev pandoc

      # Cache the renv global cache + the plain library directory
      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/R/renv
            /home/runner/R/lib
          key: renv-check-${{ runner.os }}-${{ hashFiles('renv.lock') }}
          restore-keys: |
            renv-check-${{ runner.os }}-

      # Install packages into the plain library via renv::restore().
      # RENV_PATHS_LIBRARY tells renv to install here instead of
      # its default symlink-based project library.
      - name: Restore R packages
        run: |
          mkdir -p /home/runner/R/lib
          Rscript -e '
            if (!requireNamespace("renv", quietly = TRUE)) install.packages("renv")
            renv::restore(prompt = FALSE)
            # Install Suggests deps (not in renv.lock) + check tools
            for (pkg in c("rcmdcheck", "pkgload", "ggplot2", "targets", "testthat", "withr")) {
              if (!requireNamespace(pkg, quietly = TRUE)) install.packages(pkg)
            }
          '

      - name: R CMD check
        run: |
          Rscript -e '
            rcmdcheck::rcmdcheck(
              args = c("--no-manual", "--as-cran"),
              error_on = "warning",
              check_dir = "check"
            )
          '

      - name: Validate packages_curated.csv
        run: |
          Rscript -e '
            pkgload::load_all(export_all = TRUE)
            curated <- read.csv("data-raw/packages_curated.csv", stringsAsFactors = FALSE)
            cats <- read.csv("data-raw/categories.csv", stringsAsFactors = FALSE)
            result <- validate_curated_csv(curated, cats$category)
            if (!result$valid) {
              cat("CSV validation FAILED:\n")
              for (err in result$errors) cat("  -", err, "\n")
              quit(status = 1)
            }
            cat("CSV validation passed\n")
          '
