# =============================================================================
# check.yml
#
# PR checks workflow: runs R CMD check (which includes testthat tests)
# and CSV validation on pull requests.
#
# Part of Milestone 10: Docker & Cloud Run Deployment
# =============================================================================

name: PR Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.3'
          use-public-rspm: true

      # Cache R packages in a plain library (not renv's symlink-based layout).
      # renv's project library uses symlinks to a global cache, which breaks
      # when R CMD check runs with --vanilla (no .Rprofile = no renv activation).
      # Instead, use renv::restore() to install into a plain library directory
      # that R CMD check can access directly via R_LIBS_USER.
      - name: Cache R library
        uses: actions/cache@v4
        with:
          path: ~/R/lib
          key: r-lib-${{ runner.os }}-r-4.5.3-${{ hashFiles('renv.lock') }}
          restore-keys: |
            r-lib-${{ runner.os }}-r-4.5.3-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libpng-dev \
            libtiff5-dev \
            libjpeg-dev \
            libharfbuzz-dev \
            libfribidi-dev

      - name: Restore packages into plain library
        env:
          R_LIBS_USER: ~/R/lib
        run: |
          mkdir -p ~/R/lib
          Rscript -e '
            lib <- Sys.getenv("R_LIBS_USER")
            if (!requireNamespace("renv", quietly = TRUE)) install.packages("renv", lib = lib)
            renv::restore(prompt = FALSE, library = lib)
            # Also install check tools
            pkgs <- c("rcmdcheck", "pkgload")
            for (p in pkgs) {
              if (!requireNamespace(p, quietly = TRUE)) install.packages(p, lib = lib)
            }
          '

      - name: R CMD check
        env:
          R_LIBS_USER: ~/R/lib
        run: |
          Rscript -e '
            rcmdcheck::rcmdcheck(
              args = c("--no-manual", "--as-cran"),
              error_on = "warning",
              check_dir = "check"
            )
          '

      - name: Validate packages_curated.csv
        run: |
          Rscript -e '
            pkgload::load_all(export_all = TRUE)
            curated <- read.csv("data-raw/packages_curated.csv", stringsAsFactors = FALSE)
            cats <- read.csv("data-raw/categories.csv", stringsAsFactors = FALSE)
            result <- validate_curated_csv(curated, cats$category)
            if (!result$valid) {
              cat("CSV validation FAILED:\n")
              for (err in result$errors) cat("  -", err, "\n")
              quit(status = 1)
            }
            cat("CSV validation passed\n")
          '
