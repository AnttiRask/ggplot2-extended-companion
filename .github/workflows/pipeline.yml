# =============================================================================
# pipeline.yml
#
# Daily data pipeline: fetches CRAN metadata, download stats, and GitHub
# metadata via targets, then builds and deploys the Docker image to
# Google Cloud Run.
#
# Schedule: Daily at 06:00 UTC
# Manual trigger: workflow_dispatch
#
# Part of Milestone 10: Docker & Cloud Run Deployment
# =============================================================================

name: Daily Pipeline

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      refresh_examples:
        description: 'Also re-render code examples'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

env:
  GCP_REGION: europe-north1
  GCP_SERVICE_NAME: ggplot2-companion

jobs:
  pipeline:
    runs-on: ubuntu-latest

    env:
      HAS_GCP: ${{ secrets.GCP_PROJECT_ID != '' }}

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.3'
          use-public-rspm: true

      # Install system libraries required by R packages.
      # List from: pak::pkg_sysreqs(renv packages, "ubuntu-22.04")
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev libssl-dev libxml2-dev cmake \
            libfontconfig1-dev libfreetype6-dev libpng-dev \
            libtiff-dev libjpeg-dev libwebp-dev libicu-dev \
            libharfbuzz-dev libfribidi-dev libglpk-dev

      # Cache the renv global package cache. This is where renv stores
      # downloaded/compiled packages. renv::restore() checks this cache
      # before downloading, making subsequent runs near-instant.
      # Key is based on renv.lock — only changes when dependencies change.
      - name: Cache renv packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/R/renv
          key: renv-pipeline-${{ runner.os }}-${{ hashFiles('renv.lock') }}
          restore-keys: |
            renv-pipeline-${{ runner.os }}-

      # Restore packages from renv.lock into the project library.
      # With a warm cache, this takes ~10 seconds (symlinks from cache).
      # Cold cache: downloads from RSPM (binary packages, ~2–3 minutes).
      - name: Restore R packages
        run: |
          Rscript -e '
            if (!requireNamespace("renv", quietly = TRUE)) install.packages("renv")
            renv::restore(prompt = FALSE)
            # Install Suggests deps not in renv.lock (needed by _targets.R)
            for (pkg in c("targets", "pkgload")) {
              if (!requireNamespace(pkg, quietly = TRUE)) install.packages(pkg)
            }
          '

      # Cache targets metadata and outputs between runs.
      # Key includes R source hash so code changes invalidate the cache.
      # No restore-keys fallback — stale metadata causes targets to skip
      # re-running even when pipeline functions change. Better to re-run
      # from scratch (~10 min) than deploy stale data.
      - name: Cache targets
        uses: actions/cache@v4
        with:
          path: _targets/
          key: targets-${{ hashFiles('data-raw/packages_curated.csv', 'R/**') }}-${{ github.run_id }}

      # Restore examples data produced by the weekly examples pipeline.
      # The daily pipeline skips example rendering (RENDER_EXAMPLES not set),
      # but the Docker image needs examples.parquet and PNGs to display
      # code examples in the detail view.
      - name: Cache examples data
        uses: actions/cache@v4
        with:
          path: |
            data/examples.parquet
            inst/app/www/examples/
          key: examples-data-${{ hashFiles('data-raw/packages_curated.csv') }}
          restore-keys: |
            examples-data-

      - name: Run targets pipeline
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: Rscript -e 'targets::tar_make()'

      - name: Authenticate to Google Cloud
        if: env.HAS_GCP == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        if: env.HAS_GCP == 'true'
        env:
          REGION: ${{ env.GCP_REGION }}
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev"

      - name: Set up Docker Buildx
        if: env.HAS_GCP == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        if: env.HAS_GCP == 'true'
        uses: docker/build-push-action@v5
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: ${{ env.GCP_REGION }}
          SERVICE: ${{ env.GCP_SERVICE_NAME }}
        with:
          context: .
          push: true
          tags: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.SERVICE }}/${{ env.SERVICE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Cloud Run
        if: env.HAS_GCP == 'true'
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: ${{ env.GCP_REGION }}
          SERVICE: ${{ env.GCP_SERVICE_NAME }}
          SHA: ${{ github.sha }}
        run: |
          IMAGE_TAG="${REGION}-docker.pkg.dev/${PROJECT_ID}/${SERVICE}/${SERVICE}:${SHA}"
          gcloud run deploy "${SERVICE}" \
            --image "${IMAGE_TAG}" \
            --region "${REGION}" \
            --platform managed \
            --allow-unauthenticated \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 3 \
            --concurrency 80 \
            --port 3838
