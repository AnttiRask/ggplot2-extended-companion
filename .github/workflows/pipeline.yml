# =============================================================================
# pipeline.yml
#
# Daily data pipeline: fetches CRAN metadata, download stats, and GitHub
# metadata via targets, then builds and deploys the Docker image to
# Google Cloud Run.
#
# Schedule: Daily at 06:00 UTC
# Manual trigger: workflow_dispatch
#
# Part of Milestone 10: Docker & Cloud Run Deployment
# =============================================================================

name: Daily Pipeline

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      refresh_examples:
        description: 'Also re-render code examples'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

env:
  GCP_REGION: europe-north1
  GCP_SERVICE_NAME: ggplot2-companion

jobs:
  pipeline:
    runs-on: ubuntu-latest

    env:
      HAS_GCP: ${{ secrets.GCP_PROJECT_ID != '' }}

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.3'
          use-public-rspm: true

      # Cache the renv library using renv.lock as the key.
      # setup-r-dependencies@v2 uses pak's lockfile which changes hash
      # every run, causing cache misses and 53-minute reinstalls.
      # Using renv.lock directly gives a stable key that only changes
      # when dependencies are actually updated.
      - name: Cache renv library
        uses: actions/cache@v4
        with:
          path: ~/.cache/R/renv
          key: renv-${{ runner.os }}-r-4.5.3-${{ hashFiles('renv.lock') }}
          restore-keys: |
            renv-${{ runner.os }}-r-4.5.3-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libpng-dev \
            libtiff5-dev \
            libjpeg-dev \
            libharfbuzz-dev \
            libfribidi-dev

      - name: Restore renv packages
        run: |
          Rscript -e '
            if (!requireNamespace("renv", quietly = TRUE)) install.packages("renv")
            renv::restore(prompt = FALSE)
          '

      - name: Install targets (if not in renv.lock)
        run: |
          Rscript -e '
            if (!requireNamespace("targets", quietly = TRUE)) install.packages("targets")
          '

      - name: Cache targets
        uses: actions/cache@v4
        with:
          path: _targets/
          key: targets-${{ hashFiles('data-raw/packages_curated.csv') }}-${{ github.run_id }}
          restore-keys: |
            targets-${{ hashFiles('data-raw/packages_curated.csv') }}-

      - name: Run targets pipeline
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: Rscript -e 'targets::tar_make()'

      - name: Authenticate to Google Cloud
        if: env.HAS_GCP == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        if: env.HAS_GCP == 'true'
        env:
          REGION: ${{ env.GCP_REGION }}
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev"

      - name: Set up Docker Buildx
        if: env.HAS_GCP == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        if: env.HAS_GCP == 'true'
        uses: docker/build-push-action@v5
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: ${{ env.GCP_REGION }}
          SERVICE: ${{ env.GCP_SERVICE_NAME }}
        with:
          context: .
          push: true
          tags: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.SERVICE }}/${{ env.SERVICE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Cloud Run
        if: env.HAS_GCP == 'true'
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: ${{ env.GCP_REGION }}
          SERVICE: ${{ env.GCP_SERVICE_NAME }}
          SHA: ${{ github.sha }}
        run: |
          IMAGE_TAG="${REGION}-docker.pkg.dev/${PROJECT_ID}/${SERVICE}/${SERVICE}:${SHA}"
          gcloud run deploy "${SERVICE}" \
            --image "${IMAGE_TAG}" \
            --region "${REGION}" \
            --platform managed \
            --allow-unauthenticated \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 3 \
            --concurrency 80 \
            --port 3838
