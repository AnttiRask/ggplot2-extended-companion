# =============================================================================
# check.yml
#
# PR checks workflow: runs R CMD check, testthat tests, and CSV validation
# on pull requests. Ensures code quality before merging.
#
# Part of Milestone 10: Docker & Cloud Run Deployment
# =============================================================================

name: PR Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.3'
          use-public-rspm: true

      - name: Setup R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: R CMD check
        uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'

      - name: Run testthat tests
        run: Rscript -e 'devtools::test()'

      - name: Validate packages_curated.csv
        run: |
          Rscript -e '
            pkgload::load_all(export_all = TRUE)
            curated <- read.csv("data-raw/packages_curated.csv", stringsAsFactors = FALSE)
            cats <- read.csv("data-raw/categories.csv", stringsAsFactors = FALSE)
            result <- validate_curated_csv(curated, cats$category)
            if (!result$valid) {
              cat("CSV validation FAILED:\n")
              for (err in result$errors) cat("  -", err, "\n")
              quit(status = 1)
            }
            cat("CSV validation passed\n")
          '
